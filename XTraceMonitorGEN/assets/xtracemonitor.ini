 
; General section of configuration
[general]
scraperwebscripturldownload=                                                                      ; Scrapper WEB Script URL download
showdetailinfo=0000                                                                               ; Show Detail info
trace_target01=3,xtracegen.dyndns.org:10001                                                       ; eXtended Trace Aim
trace_target02=                                                                                   ; eXtended Trace Aim
trace_target03=                                                                                   ; eXtended Trace Aim
trace_target04=                                                                                   ; eXtended Trace Aim
trace_target05=                                                                                   ; eXtended Trace Aim
defaultlanguage=spa                                                                               ; Spanish
 
; Internet services section of configuration
[internet services]
checkinternetstatuscadenceseconds=30                                                              ; Internet connection status cadence
donotletinternetconnectionmatter=no                                                               ; Do not let Internet connection matter
checkipschangecadenceseconds=3600                                                                 ; Internet IP Change Cadence
updatetimebyntpcadencehours=4                                                                     ; Internet update time by NTP cadence
updatetimentpserver01=1.es.pool.ntp.org                                                           ; Internet update NTP Server
updatetimentpserver02=1.europe.pool.ntp.org                                                       ; Internet update NTP Server
updatetimentpserver03=3.europe.pool.ntp.org                                                       ; Internet update NTP Server
updatetimentpmeridiandifference=25                                                                ; Internet update meridian difference
updatetimentpusedaylightsaving=yes                                                                ; Internet update time day light saving
 
; Log section of configuration
[log]
isactive=yes                                                                                      ; De/Activate log generation
backupisactive=yes                                                                                ; De/Activate backup for the log
backupmaxfiles=10                                                                                 ; Maximum number of backup files (ZIP)
backupiscompress=yes                                                                              ; De/Activate compression in log backup
activesectionsID=Ini,General,Status,End                                                           ; Section filter by ID in the log
levelmask=000F                                                                                    ; Filter by level mask
maxsize=3000                                                                                      ; Limit of the main file to perform the backup (in Kb)
reductionpercent=10                                                                               ; Reduction (percentage) of the main file when performing backup
 
; Application section of configuration
[application]
colortheme=1                                                                                      ; Color theme (0=invalid, 1=Dark, 2=Light)
savescreenposition=yes                                                                            ; Save main window position on exit
savescreensize=yes                                                                                ; Save main window size on exit
savedscreenposition=0, 0                                                                          ; Last main window position (x, y)
savedscreensize=2560, 1392                                                                        ; Last main window size (width, height)
udpport=10601                                                                                     ; UDP listen port for incoming XTrace datagrams
uartport=2,115200,8,N,1,NONE                                                                      ; UART serial line (Port,Baudrate,DataBits,Parity,StopBits,Flow)
 
; Console line prefix options
[console]
adddatetimeconsole=no                                                                             ; Prefix each console line with date/time
addipconsole=no                                                                                   ; Prefix each console line with source IP
texttracking=no                                                                                   ; Follow / auto-scroll console text
 
; DynDNS access (password stored AES+Base64)
[dyndns]
active=yes                                                                                        ; Enable DynDNS toolbar and credentials
login=                                                                                            ; DynDNS login (empty when inactive)
password=                                                                                         ; DynDNS password AES+Base64 (empty when inactive)
 
; Trace targets (legacy servers): type1=UDP host,port ; type2=UART (port,baud,...)
[target]
item01=1,GEN FrameWork,xtracegen.dyndns.org,10001                                                 ; Target item (type,name,...)
item02=1,EndoraSoft,xtraceendorasoft.dyndns.org,10101                                             ; Target item (type,name,...)
item03=1,IMT,xtraceimt.dyndns.org,10201                                                           ; Target item (type,name,...)
item04=1,Bizintek,xtracebizintek.dyndns.org,10301                                                 ; Target item (type,name,...)
item05=1,Lantek,xtracelantek.dyndns.org,10401                                                     ; Target item (type,name,...)
item06=1,Symplio,xtracesymplio.dyndns.org,10501                                                   ; Target item (type,name,...)
item07=2,UART STM32 WB55 0,(7,115200,8,N,1,NONE)                                                  ; Target item (type,name,...)
item08=2,UART STM32 F0,(2,115200,8,N,1,NONE)                                                      ; Target item (type,name,...)
item09=1,CAF,xtracecaf.dyndns.org,10601                                                           ; Target item (type,name,...)
item10=1,IMT 2,xtraceimt.dyndns.org,10701                                                         ; Target item (type,name,...)
 
; Trace origins (legacy origins XX): isactive,showip,name,url,ip
[origins]
item01=yes,yes,Local,xdebug.kicks-ass.org,                                                        ; Origin item (isactive,showip,name,url,ip)
